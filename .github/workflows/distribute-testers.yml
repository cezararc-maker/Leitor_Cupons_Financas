name: Distribuir para testadores

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versao exibida, ex.: 0.2.0"
        required: true
        type: string
      version_code:
        description: "Codigo inteiro crescente. Deixe vazio para usar o numero da execucao."
        required: false
        type: string
      release_notes:
        description: "Resumo curto das mudancas"
        required: true
        type: string
      firebase_group:
        description: "Alias do grupo de testadores no Firebase"
        required: true
        default: "leitor-cupons-testadores"
        type: string

  push:
    tags:
      - "tester-v*"

permissions:
  contents: read

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK manager
        id: sdk
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          echo "sdk_root=$SDK_ROOT" >> "$GITHUB_OUTPUT"
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | "${{ steps.sdk.outputs.sdkmanager }}" --licenses > /dev/null || true
          "${{ steps.sdk.outputs.sdkmanager }}" "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION_NAME: "${{ github.event.inputs.version_name }}"
          INPUT_VERSION_CODE: "${{ github.event.inputs.version_code }}"
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION_NAME="${GITHUB_REF_NAME#tester-v}"
          else
            VERSION_NAME="$INPUT_VERSION_NAME"
          fi

          if [ -z "$VERSION_NAME" ]; then
            echo "Version name is required."
            exit 1
          fi

          VERSION_CODE="$INPUT_VERSION_CODE"
          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE="${GITHUB_RUN_NUMBER}"
          fi

          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "Version code must be an integer."
            exit 1
          fi

          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Validate protected secrets
        shell: bash
        env:
          KEYSTORE_B64: "${{ secrets.LCF_RELEASE_KEYSTORE_BASE64 }}"
          STORE_PASSWORD: "${{ secrets.LCF_RELEASE_KEYSTORE_PASSWORD }}"
          KEY_ALIAS: "${{ secrets.LCF_RELEASE_KEY_ALIAS }}"
          KEY_PASSWORD: "${{ secrets.LCF_RELEASE_KEY_PASSWORD }}"
          FIREBASE_APP_ID: "${{ secrets.FIREBASE_APP_ID_ANDROID }}"
          FIREBASE_SERVICE_ACCOUNT_B64: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}"
        run: |
          missing=0
          for value in "$KEYSTORE_B64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" "$FIREBASE_APP_ID" "$FIREBASE_SERVICE_ACCOUNT_B64"; do
            if [ -z "$value" ]; then
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Segredos de assinatura/Firebase ainda nao foram configurados."
            echo "Consulte docs/DISTRIBUICAO_SEGURA.md."
            exit 1
          fi

      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_B64: "${{ secrets.LCF_RELEASE_KEYSTORE_BASE64 }}"
          STORE_PASSWORD: "${{ secrets.LCF_RELEASE_KEYSTORE_PASSWORD }}"
          KEY_ALIAS: "${{ secrets.LCF_RELEASE_KEY_ALIAS }}"
          KEY_PASSWORD: "${{ secrets.LCF_RELEASE_KEY_PASSWORD }}"
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/leitor-cupons-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          echo "LCF_RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "LCF_RELEASE_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "LCF_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "LCF_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Unit tests
        run: gradle testDebugUnitTest

      - name: Build signed release APK
        run: >
          gradle assembleRelease
          -PLCF_REQUIRE_RELEASE_SIGNING=true
          -PLCF_VERSION_NAME="${{ steps.version.outputs.name }}"
          -PLCF_VERSION_CODE="${{ steps.version.outputs.code }}"

      - name: Verify APK signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "Signed APK not found: $APK"
            exit 1
          fi

          APKSIGNER=$(find "${{ steps.sdk.outputs.sdk_root }}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Prepare Firebase service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}"
        run: |
          CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_B64" | base64 --decode > "$CREDENTIALS"
          chmod 600 "$CREDENTIALS"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIALS" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Distribute only to authorized testers
        shell: bash
        env:
          FIREBASE_APP_ID: "${{ secrets.FIREBASE_APP_ID_ANDROID }}"
          INPUT_GROUP: "${{ github.event.inputs.firebase_group }}"
          INPUT_NOTES: "${{ github.event.inputs.release_notes }}"
        run: |
          GROUP="$INPUT_GROUP"
          NOTES="$INPUT_NOTES"

          if [ -z "$GROUP" ]; then
            GROUP="leitor-cupons-testadores"
          fi

          if [ -z "$NOTES" ]; then
            NOTES="Versao ${{ steps.version.outputs.name }} para testadores autorizados."
          fi

          firebase appdistribution:distribute             "app/build/outputs/apk/release/app-release.apk"             --app "$FIREBASE_APP_ID"             --groups "$GROUP"             --release-notes "$NOTES"
