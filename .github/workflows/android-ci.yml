name: Android CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK manager
        id: sdk
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          echo "sdk_root=$SDK_ROOT" >> "$GITHUB_OUTPUT"
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | "${{ steps.sdk.outputs.sdkmanager }}" --licenses > /dev/null || true
          "${{ steps.sdk.outputs.sdkmanager }}" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Unit tests and compile
        run: gradle test assembleDebug
